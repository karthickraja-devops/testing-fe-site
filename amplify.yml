version: 1

frontend:
  phases:
    preBuild:
      commands:
        - yarn install

    build:
      commands:
        - env | grep -e OPTIMIZELY_API_KEY -e OPTIMIZELY_SDK_KEY -e OPTIMIZELY_PROJECT_ID -e OPTIMIZELY_WEBHOOK_SECRET -e API_TOKEN -e TEAM_ID -e EDGE_CONFIG -e FLAGS_SECRET >> .env.production
        - yarn build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*